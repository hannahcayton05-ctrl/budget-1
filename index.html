<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column, summary card first, then add-expense, categories, purchases, past months. */
:root{
  --bg:#eef2f3;
  --surface:#ffffff;
  --ink:#16252b;
  --muted:#5f7178;
  --line:#dbe3e6;
  --accent:#12756f;
  --accent-soft:#d9efec;
  --good:#1f8a4c;
  --warn:#c07a12;
  --bad:#c2413a;
  --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#172226; --ink:#e7eff1; --muted:#93a6ac; --line:#26363b;
    --accent:#4cc3b9; --accent-soft:#16403d; --good:#5acb87; --warn:#e4a948; --bad:#f07a71; --bad-soft:#3d1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172226; --ink:#e7eff1; --muted:#93a6ac; --line:#26363b;
  --accent:#4cc3b9; --accent-soft:#16403d; --good:#5acb87; --warn:#e4a948; --bad:#f07a71; --bad-soft:#3d1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cycle-nav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.cycle-nav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.cycle-nav button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.cycle-nav button:disabled{opacity:.3;cursor:default}
.cycle-label{font-weight:600;padding:0 6px;min-width:150px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.hero{display:grid;gap:16px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.big-sub{color:var(--muted);margin-top:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.status.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease}
.bar.warn>span{background:var(--warn)}
.bar.bad>span{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

.budget-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:42px}
.field span{color:var(--muted);margin-right:4px}
.field input{border:0;background:transparent;outline:none;width:100%;height:100%}
.btn{border:0;border-radius:10px;height:42px;padding:0 16px;font-weight:600;background:var(--accent);color:#fff}
[data-theme="dark"] .btn{color:#06201e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#06201e}}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}

form.add{display:grid;gap:12px}
.add-row{display:grid;grid-template-columns:140px 1fr 150px;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;min-height:1em}

.cats{display:grid;gap:12px}
.cat-row{display:grid;grid-template-columns:150px 1fr 80px;gap:12px;align-items:center}
.cat-name{display:flex;align-items:center;gap:8px;font-weight:500}
.cat-name i{width:10px;height:10px;border-radius:3px;flex:none}
.cat-bar{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.cat-bar span{display:block;height:100%;border-radius:999px}
.cat-amt{text-align:right;font-weight:600}
.cat-pct{color:var(--muted);font-weight:400;font-size:12px;display:block}

.list{display:grid}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.day:first-child{padding-top:0}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700}
.item .desc{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.item .amt{font-weight:700}
.del{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:16px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.del.confirm{width:auto;padding:0 10px;background:var(--bad);color:#fff;font-size:13px;font-weight:600}

.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:14px;padding:14px 16px;font-size:14px}
.banner strong{display:block;margin-bottom:2px}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.history{display:grid;gap:2px}
.h-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.h-row button{text-align:left;border:0;background:none;padding:0;font-weight:600}
.h-row button:hover{color:var(--accent)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--bg);color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px}
.section-head .sub{color:var(--muted);font-size:13px}

@media (max-width:560px){
  .add-row{grid-template-columns:1fr 1fr}
  .add-row .desc-field{grid-column:1 / -1;order:-1}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1 / -1}
  .cat-row{grid-template-columns:110px 1fr 70px}
  .big{font-size:38px}
}
@media (prefers-reduced-motion: reduce){.bar>span{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Card Budget</h1>
    <nav class="cycle-nav" aria-label="Billing cycle">
      <button id="prev" type="button" aria-label="Previous cycle">‹</button>
      <div class="cycle-label" id="cycleLabel">…</div>
      <button id="next" type="button" aria-label="Next cycle">›</button>
    </nav>
  </header>

    <section class="card hero" id="hero" aria-live="polite"></section>

  <section class="card">
    <div class="section-head"><h2>Add a purchase</h2></div>
    <form class="add" id="addForm" autocomplete="off">
      <div class="add-row">
        <label class="field"><span>$</span><input id="amt" inputmode="decimal" placeholder="0.00" aria-label="Amount"></label>
        <label class="field desc-field"><input id="desc" placeholder="What was it? (e.g. Wawa gas)" aria-label="Description" maxlength="80"></label>
        <label class="field"><input id="date" type="date" aria-label="Date"></label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Category"></div>
      <div class="form-foot">
        <div class="err" id="err"></div>
        <button class="btn" type="submit">Add purchase</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="section-head"><h2>Where it's going</h2><span class="sub" id="catSub"></span></div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>Purchases</h2><span class="sub" id="listSub"></span></div>
    <div class="list" id="list"></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>Month by month</h2><span class="sub">Each cycle runs the 18th to the 17th</span></div>
    <div class="history" id="history"></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>Backup</h2><span class="sub">Your data lives in this browser on this computer</span></div>
    <div class="budget-edit">
      <button class="btn" type="button" id="backupBtn">Download backup</button>
      <label class="btn ghost" for="restoreInput" style="display:inline-flex;align-items:center;cursor:pointer">Restore from backup</label>
      <input type="file" id="restoreInput" accept=".json,application/json" hidden>
    </div>
    <p class="note" id="backupMsg" style="text-align:left;margin:10px 0 0">If you clear Chrome's browsing data or switch computers, restore from your latest backup file.</p>
  </section>

  <p class="note" id="saveNote">Loading your budget…</p>
</main>

<script>
(function(){
  const CATS = [
    ["Groceries","#2f9e5b"],["Gas","#e0892b"],["Dining out","#d9534f"],["Bills & subscriptions","#3a78c9"],
    ["Shopping","#c2479b"],["Car","#1a9aa0"],["School","#7b5cc9"],["Pets","#c9a227"],
    ["Personal care","#e07aa8"],["Fun","#41b3a3"],["Other","#8a979c"]
  ];
  const CAT_COLOR = Object.fromEntries(CATS);
  const START_DAY = 18;
  const FIRST_CYCLE = "2026-11-18";

  // ---------- date helpers (local dates as YYYY-MM-DD strings) ----------
  const pad = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
  const todayStr = () => ymd(new Date());
  function cycleStartFor(s){
    const d = parse(s);
    const start = d.getDate() >= START_DAY ? new Date(d.getFullYear(), d.getMonth(), START_DAY)
                                           : new Date(d.getFullYear(), d.getMonth()-1, START_DAY);
    return ymd(start);
  }
  function shiftCycle(key, n){ const d = parse(key); return ymd(new Date(d.getFullYear(), d.getMonth()+n, START_DAY)); }
  function cycleEnd(key){ const d = parse(key); return ymd(new Date(d.getFullYear(), d.getMonth()+1, START_DAY-1)); }
  const fmtDay = (s, opts) => parse(s).toLocaleDateString("en-US", opts || {month:"short", day:"numeric"});
  function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
  const money = n => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- state ----------
  let settings = { defaultBudget: null, budgets: {} };
  let expenses = []; // {id, amount, desc, cat, date, created}
  let viewCycle = cycleStartFor(todayStr());
  let editingBudget = false;
  let selectedCat = "Groceries";
  let pendingDelete = null;
  let backend = null;

  const budgetFor = key => {
    if (settings.budgets && typeof settings.budgets[key] === "number") return settings.budgets[key];
    // carry forward: the most recent earlier cycle's budget, then default
    const keys = Object.keys(settings.budgets||{}).filter(k => k <= key).sort();
    if (keys.length) return settings.budgets[keys[keys.length-1]];
    return typeof settings.defaultBudget === "number" ? settings.defaultBudget : null;
  };
  const inCycle = (e, key) => e.date >= key && e.date <= cycleEnd(key);

  // ---------- storage backends ----------
  const STORE_KEY = "card-budget-v1";
  let storageWorks = false;
  try { localStorage.setItem("__cb_test","1"); localStorage.removeItem("__cb_test"); storageWorks = true; } catch(e){}
  function loadLocal(){
    try { const raw = localStorage.getItem(STORE_KEY); if (raw){ const m = JSON.parse(raw); if (m && typeof m === "object") return m; } } catch(e){}
    // first open: start with the $1,250 monthly budget
    return { settings: { defaultBudget: 1250, budgets: { "2026-11-18": 1250 } }, expenses: [] };
  }
  function saveLocal(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ settings, expenses })); return true; }
    catch(e){ setNote("Couldn't save. Chrome may be blocking storage for this file. Use Download backup so you don't lose anything.", true); return false; }
  }
  function dbBackend(db, uid){
    const settingsRef = db.doc("data/users/" + uid + "/settings");
    const expCol = db.doc("data/users/" + uid + "/profile").collection("expenses");
    let chain = Promise.resolve();
    const queue = fn => (chain = chain.then(fn, fn));
    return {
      kind: "db",
      start(onSettings, onExpenses, onLoaded, onError){
        let settled = { s:false, e:false };
        const timer = setTimeout(() => onError("Can't reach your saved budget yet. Check your connection; it will keep trying."), 10000);
        const done = (k, snap) => { if (!snap.metadata.fromCache) settled[k] = true; if (settled.s && settled.e){ clearTimeout(timer); onLoaded(); } };
        settingsRef.onSnapshot(snap => { onSettings(snap.exists ? snap.data() : { defaultBudget:null, budgets:{} }); done("s", snap); },
          err => { clearTimeout(timer); onError("Your budget couldn't be loaded (" + err.code + ")."); });
        expCol.onSnapshot(snap => { onExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))); done("e", snap); },
          err => { clearTimeout(timer); onError("Your purchases couldn't be loaded (" + err.code + ")."); });
      },
      saveSettings(s){ return queue(() => settingsRef.set(s)); },
      async addExpense(e){ const ref = expCol.doc(); await ref.set(e); return ref.id; },
      async deleteExpense(id){ await expCol.doc(id).delete(); }
    };
  }

  // ---------- rendering ----------
  const $ = id => document.getElementById(id);

  function renderNav(){
    const end = cycleEnd(viewCycle);
    const sameYear = parse(viewCycle).getFullYear() === parse(end).getFullYear();
    $("cycleLabel").textContent = fmtDay(viewCycle) + " – " + fmtDay(end, {month:"short", day:"numeric", year: sameYear ? undefined : "numeric"});
    $("prev").disabled = viewCycle <= FIRST_CYCLE && !expenses.some(e => e.date < viewCycle);
  }

  function renderHero(){
    const key = viewCycle, end = cycleEnd(key), today = todayStr();
    const list = expenses.filter(e => inCycle(e, key));
    const spent = list.reduce((s,e) => s + (Number(e.amount)||0), 0);
    const budget = budgetFor(key);
    const isCurrent = today >= key && today <= end;
    const isFuture = today < key;
    const daysLeft = isCurrent ? daysBetween(today, end) + 1 : 0;
    let html = "";

    if (editingBudget || budget === null){
      html += `<div>
        <div class="big-sub" style="margin:0 0 10px">${budget === null ? "Start by setting how much you want to spend on your card each cycle." : "Change your budget for this cycle and the ones after it."}</div>
        <form class="budget-edit" id="budgetForm">
          <label class="field" style="width:180px"><span>$</span><input id="budgetInput" inputmode="decimal" placeholder="500" aria-label="Monthly budget" value="${budget!==null ? budget : ""}"></label>
          <button class="btn" type="submit">Save budget</button>
          ${budget !== null ? '<button class="btn ghost" type="button" id="cancelBudget">Cancel</button>' : ""}
        </form>
      </div>`;
    }
    if (budget !== null){
      const left = budget - spent;
      const pct = budget > 0 ? spent / budget : 0;
      const tone = pct > 1 ? "bad" : pct >= .8 ? "warn" : "";
      const statusText = pct > 1 ? "Over budget" : pct >= .8 ? "Getting close" : isFuture ? "Upcoming" : "On track";
      const perDay = isCurrent && left > 0 ? left / daysLeft : null;
      html += `<div class="hero-row">
          <div>
            <div class="big num" style="${left<0?'color:var(--bad)':''}">${money(Math.abs(left))}</div>
            <div class="big-sub">${left < 0 ? "over your " : "left of your "}${money(budget)} budget · <button class="link" type="button" id="editBudget">Edit</button></div>
          </div>
          <span class="status ${tone}">${statusText}</span>
        </div>
        <div class="bar ${tone}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct*100)}" aria-label="Budget used"><span style="width:${Math.min(pct,1)*100}%"></span></div>
        <div class="stats">
          <div class="stat"><div class="k">Spent</div><div class="v num">${money(spent)}</div></div>
          <div class="stat"><div class="k">Used</div><div class="v num">${Math.round(pct*100)}%</div></div>
          <div class="stat"><div class="k">${isCurrent ? "Per day left" : isFuture ? "Starts" : "Purchases"}</div><div class="v num">${
            isCurrent ? (perDay !== null ? money(perDay) + `<span style="font-size:13px;font-weight:500;color:var(--muted)"> · ${daysLeft} day${daysLeft===1?"":"s"}</span>` : "$0.00")
            : isFuture ? fmtDay(key) : list.length}</div></div>
        </div>`;
    }
    $("hero").innerHTML = html;

    const bf = $("budgetForm");
    if (bf){
      bf.addEventListener("submit", ev => {
        ev.preventDefault();
        const v = parseFloat(String($("budgetInput").value).replace(/[$,\s]/g,""));
        if (!(v >= 0)) { $("budgetInput").focus(); return; }
        const val = Math.round(v*100)/100;
        const budgets = { ...(settings.budgets||{}) };
        budgets[viewCycle] = val;
        settings = { defaultBudget: val, budgets };
        editingBudget = false;
        render();
        backend.saveSettings(settings).catch(() => setNote("Your budget didn't save. Try again in a moment.", true));
      });
      const c = $("cancelBudget"); if (c) c.addEventListener("click", () => { editingBudget = false; renderHero(); });
      if (editingBudget) setTimeout(() => $("budgetInput") && $("budgetInput").focus(), 0);
    }
    const eb = $("editBudget"); if (eb) eb.addEventListener("click", () => { editingBudget = true; renderHero(); });
  }

  function renderCats(){
    const list = expenses.filter(e => inCycle(e, viewCycle));
    const total = list.reduce((s,e) => s + (Number(e.amount)||0), 0);
    const by = {};
    list.forEach(e => { const c = CAT_COLOR[e.cat] ? e.cat : "Other"; by[c] = (by[c]||0) + (Number(e.amount)||0); });
    const rows = Object.entries(by).sort((a,b) => b[1]-a[1]);
    $("catSub").textContent = rows.length ? rows.length + (rows.length===1?" category":" categories") : "";
    if (!rows.length){ $("cats").innerHTML = `<div class="empty">Your spending by category shows up here once you add purchases.</div>`; return; }
    const max = rows[0][1] || 1;
    $("cats").innerHTML = rows.map(([c,amt]) => `
      <div class="cat-row">
        <div class="cat-name"><i style="background:${CAT_COLOR[c]}"></i>${esc(c)}</div>
        <div class="cat-bar"><span style="width:${(amt/max)*100}%;background:${CAT_COLOR[c]}"></span></div>
        <div class="cat-amt num">${money(amt)}<span class="cat-pct">${total>0?Math.round(amt/total*100):0}%</span></div>
      </div>`).join("");
  }

  function renderList(){
    const list = expenses.filter(e => inCycle(e, viewCycle))
      .sort((a,b) => a.date === b.date ? (b.created||0) - (a.created||0) : (a.date < b.date ? 1 : -1));
    $("listSub").textContent = list.length ? list.length + (list.length===1?" purchase":" purchases") : "";
    if (!list.length){ $("list").innerHTML = `<div class="empty">No purchases in this cycle yet.</div>`; return; }
    let html = "", lastDay = null;
    list.forEach(e => {
      if (e.date !== lastDay){ lastDay = e.date; html += `<div class="day">${fmtDay(e.date,{weekday:"short", month:"short", day:"numeric"})}</div>`; }
      const color = CAT_COLOR[e.cat] || CAT_COLOR.Other;
      const initials = (e.cat||"Other").split(/[\s&]+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();
      const confirming = pendingDelete === e.id;
      html += `<div class="item">
        <div class="dot" style="background:${color}22;color:${color}">${esc(initials)}</div>
        <div><div class="desc">${esc(e.desc || e.cat || "Purchase")}</div><div class="meta">${esc(e.cat || "Other")}</div></div>
        <div class="amt num">${money(Number(e.amount)||0)}</div>
        <button type="button" class="del ${confirming?"confirm":""}" data-id="${esc(e.id)}" aria-label="${confirming?"Confirm delete":"Delete purchase"}">${confirming?"Delete":"×"}</button>
      </div>`;
    });
    $("list").innerHTML = html;
  }

  function renderHistory(){
    const current = cycleStartFor(todayStr());
    const keys = new Set([current]);
    let k = FIRST_CYCLE; while (k <= current){ keys.add(k); k = shiftCycle(k,1); }
    expenses.forEach(e => keys.add(cycleStartFor(e.date)));
    const sorted = [...keys].sort().reverse();
    $("history").innerHTML = sorted.map(key => {
      const spent = expenses.filter(e => inCycle(e,key)).reduce((s,e)=>s+(Number(e.amount)||0),0);
      const b = budgetFor(key);
      let pill;
      if (b === null || b === 0) pill = `<span class="pill none">No budget</span>`;
      else { const p = spent/b; pill = `<span class="pill ${p>1?"bad":p>=.8?"warn":"good"}">${Math.round(p*100)}%</span>`; }
      return `<div class="h-row">
        <button type="button" data-cycle="${key}">${fmtDay(key)} – ${fmtDay(cycleEnd(key),{month:"short",day:"numeric",year:"numeric"})}${key===current?' <span style="color:var(--accent);font-weight:500">· now</span>':""}</button>
        <span class="num" style="color:var(--muted)">${money(spent)}${b!==null?" / "+money(b):""}</span>
        ${pill}
      </div>`;
    }).join("");
  }

  function renderChips(){
    $("chips").innerHTML = CATS.map(([c,col]) => `<button type="button" class="chip" aria-pressed="${c===selectedCat}" data-cat="${esc(c)}"><i style="background:${col}"></i>${esc(c)}</button>`).join("");
  }

  function render(){ renderNav(); renderHero(); renderCats(); renderList(); renderHistory(); }

  function setNote(text, isError){ const n = $("saveNote"); n.textContent = text; n.style.color = isError ? "var(--bad)" : ""; }

  // ---------- events ----------
  $("prev").addEventListener("click", () => { viewCycle = shiftCycle(viewCycle,-1); editingBudget=false; pendingDelete=null; render(); });
  $("next").addEventListener("click", () => { viewCycle = shiftCycle(viewCycle,1); editingBudget=false; pendingDelete=null; render(); });
  $("chips").addEventListener("click", ev => { const b = ev.target.closest(".chip"); if (!b) return; selectedCat = b.dataset.cat; renderChips(); });
  $("history").addEventListener("click", ev => { const b = ev.target.closest("[data-cycle]"); if (!b) return; viewCycle = b.dataset.cycle; editingBudget=false; render(); window.scrollTo({top:0, behavior:"smooth"}); });
  $("list").addEventListener("click", ev => {
    const b = ev.target.closest(".del"); if (!b) return;
    const id = b.dataset.id;
    if (pendingDelete !== id){ pendingDelete = id; renderList(); setTimeout(() => { if (pendingDelete === id){ pendingDelete = null; renderList(); } }, 4000); return; }
    pendingDelete = null;
    expenses = expenses.filter(e => e.id !== id); render();
    backend.deleteExpense(id).catch(() => setNote("That purchase didn't delete. Try again.", true));
  });
  $("addForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const raw = String($("amt").value).replace(/[$,\s]/g,"");
    const amount = parseFloat(raw);
    const date = $("date").value || todayStr();
    if (!(amount > 0)){ $("err").textContent = "Enter how much it cost."; $("amt").focus(); return; }
    if (!backend){ $("err").textContent = "Still loading, try again in a second."; return; }
    $("err").textContent = "";
    const e = { amount: Math.round(amount*100)/100, desc: $("desc").value.trim().slice(0,80), cat: selectedCat, date, created: Date.now() };
    $("amt").value = ""; $("desc").value = "";
    viewCycle = cycleStartFor(date);
    render();
    try {
      await backend.addExpense(e);
    } catch(err){
      setNote(err && err.code === "quota_exceeded" ? "Storage is full. Delete some old purchases to add new ones." : "That purchase didn't save. Try again.", true);
    }
    $("amt").focus();
  });

  // ---------- boot ----------
  $("date").value = todayStr();
  renderChips();
  render();

  function boot(){
    const m = loadLocal();
    settings = { defaultBudget:null, budgets:{}, ...(m.settings||{}) };
    expenses = Array.isArray(m.expenses) ? m.expenses.slice() : [];
    backend = {
      kind: "local",
      async saveSettings(){ saveLocal(); },
      async addExpense(e){ const id = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); expenses = [...expenses, { ...e, id }]; saveLocal(); render(); return id; },
      async deleteExpense(){ saveLocal(); }
    };
    if (storageWorks){ saveLocal(); setNote("Saved on this computer in this browser. Download a backup now and then to be safe."); }
    else { setNote("This browser isn't letting the app save. Use Download backup before you close it.", true); }
    render();
  }

  // ---------- backup / restore ----------
  $("backupBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app:"card-budget", version:1, savedAt:new Date().toISOString(), settings, expenses }, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "card-budget-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    $("backupMsg").textContent = "Backup downloaded. Keep it somewhere safe, like your Google Drive.";
  });
  $("restoreInput").addEventListener("change", async ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.expenses) || typeof d.settings !== "object") throw new Error("bad");
      settings = { defaultBudget:null, budgets:{}, ...d.settings };
      expenses = d.expenses.filter(e => e && typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => ({ ...e, id: String(e.id || ("e"+Math.random().toString(36).slice(2,10))) }));
      saveLocal(); viewCycle = cycleStartFor(todayStr()); render();
      $("backupMsg").textContent = "Restored " + expenses.length + " purchase" + (expenses.length===1?"":"s") + " from your backup.";
    } catch(e){ $("backupMsg").textContent = "That file isn't a Card Budget backup. Pick the .json file you downloaded from this app."; }
    ev.target.value = "";
  });

  boot();
})();
</script>
</body>
</html>
